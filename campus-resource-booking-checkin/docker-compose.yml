version: "3.9"

services:

  # -------------------------------------------------------
  # MongoDB Database
  # -------------------------------------------------------
  mongo:
    image: mongo:6
    container_name: crbs_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - crbs_network
    environment:
      MONGO_INITDB_DATABASE: crbs

  # -------------------------------------------------------
  # Backend — Node.js 18 + Express.js REST API
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crbs_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/crbs
      JWT_SECRET: changeme_use_a_strong_secret_in_production
    networks:
      - crbs_network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # -------------------------------------------------------
  # Frontend — React 18 (Create React App)
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crbs_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    networks:
      - crbs_network
    volumes:
      - ./frontend:/app
      - /app/node_modules

# -------------------------------------------------------
# Volumes
# -------------------------------------------------------
volumes:
  mongo_data:
    driver: local

# -------------------------------------------------------
# Networks
# -------------------------------------------------------
networks:
  crbs_network:
    driver: bridge
